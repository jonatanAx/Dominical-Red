<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miembros</title>

    <link rel="stylesheet" href="../static/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body class="lista-asistencia">
    <div class="burbuja burbuja-miembros">
      <div class="logo-container">
        <a href="index.html">
          <img
            src="../static/img/1-removebg-preview.png"
            alt="Red Dominical"
            class="img-logo"
          />
        </a>
      </div>
      <div class="menu">
        <a href="index.html" class="icono-volver" aria-label="Regresar">
          <i class="fa-sharp fa-regular fa-circle-left"></i>
        </a>

        <a href="Miembros.html" class="boton-menu">Miembros</a>

        <div class="boton-menu buscador-menu">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input
            type="search"
            class="input-buscar"
            placeholder="Buscar..."
            aria-label="Buscar"
          />
        </div>
      </div>
    </div>

    <div class="area-asistencia">
      <div class="panel-asistencia">
        <p class="fecha-asistencia">{{ fecha_actual }}</p>

        <div class="scroll-nombres">
          <ul class="lista-asistencia">
            {% for miembro in miembros %}
            <li>{{ miembro.nombre }}</li>
            {% else %}
            <li>Sin miembros aún</li>
            {% endfor %}
          </ul>
        </div>
      </div>

      <button type="button" class="btn-mas" aria-label="Agregar Asistencia">
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>
  </body>
</html>
